<!DOCTYPE html>
<head>
    <title>LR6</title>
    <link rel="stylesheet" href="LR6.css">
</head>
<body>
    <h2 id="total-price">Total Price: </h2>
    
    <div id = "filter">
        <button name="filter-all-btn">All</button>"
    </div>


    <div id = "sort">
        <button name="sort-price-btn">Sort by price</button>
        <button name="sort-created-btn">Sort by created date</button> 
        <button name="sort-updated-btn">Sort by updated date</button>   
        <button name="sort-reset-btn">Reset sort</button>
    </div>
    <button id="addProductButton">Add product</button>
    <dialog class="modal" id="add-modal">
        <input name="add-name" placeholder="Name" required><br>
        <input name="add-price" type="number" placeholder="Price" required>
        <select name="add-currency" placeholder="currency" required>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="UAH">UAH</option>
        </select><br>
        <input name="add-category" placeholder="category" required><br>
        <input name="add-image" placeholder="URL"><br>
        <button name="add-submit-btn">Save</button>
        <button name="add-cancel-btn">Cancel</button>
    </dialog>

    <dialog class="modal" id="edit-modal">
        <input name="edit-name" placeholder="Name" required><br>
        <input name="edit-price" type="number" placeholder="Price" required>
        <select name="edit-currency" placeholder="currency" required>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="UAH">UAH</option>
        </select><br>
        <input name="edit-category" placeholder="category" required><br>
        <input name="edit-image" placeholder="URL"><br>
        <button name="edit-submit-btn">Save</button>
        <button name="edit-cancel-btn">Cancel</button>
    </dialog>

    <div id="product-cards">

    </div>

    <div id = "snackbar"></div>
    
</body>

<script src="LR6.js"></script>
